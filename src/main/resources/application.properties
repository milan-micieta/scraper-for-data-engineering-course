spring.profiles.default=local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketlake}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.task.scheduling.pool.size=2
kiwi.python.exe=${KIWI_PYTHON_EXE:.venv/bin/python}
kiwi.python.script=src/main/python/kiwi.py
kiwi.python.timeout-seconds=150
kiwi.scrape.origins=vienna-austria,budapest-hungary,bratislava-slovakia,kosice-slovakia
kiwi.scrape.destinations=london-united-kingdom
kiwi.scrape.days=60
kiwi.scrape.cron=0 */15 * * * *
lascala.scrape.enabled=true
lascala.scrape.on-startup=true
lascala.scrape.cron=0 5,20,35,50 * * * *
lascala.python.exe=${kiwi.python.exe}
lascala.python.script=src/main/python/la_scala.py
lascala.python.timeout-seconds=90
# Synthetic test data, not real sales or actual theatre capacity.
lascala.simulation.enabled=true
lascala.simulation.capacity=2000
lascala.simulation.seed=42
