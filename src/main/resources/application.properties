spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
server.forward-headers-strategy=framework

sales.stream.enabled=true
sales.stream.lascala-topic=lascala.ticket-sales
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";

#PRODUKCIA
#spring.profiles.default=prod
#LOCAL
spring.profiles.default=local


lascala.simulation.enabled=true
lascala.simulation.capacity=2000
lascala.simulation.seed=42
lascala.simulation.horizon-days=60
lascala.simulation.default-interval-seconds=900
sales.stream.sales-topic=lascala.ticket-sales
